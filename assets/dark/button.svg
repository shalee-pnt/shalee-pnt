<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 56" width="300" height="56" role="img" aria-labelledby="title desc">
<title id="title">Throw a Poké Ball</title>
<desc id="desc">Opens a pre-filled issue that throws a ball at today's wild bug.</desc>
<style>
text{font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif}
.m{font-family:ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace}
.b{font-weight:700}
.mu{fill:#8ea3c9}
.lb{font-size:11px;letter-spacing:2.4px;font-weight:600;fill:#8ea3c9}

</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#0a1024"/><stop offset="1" stop-color="#0f1d3d"/>
</linearGradient>
<linearGradient id="mega" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="300" y2="0" spreadMethod="repeat">
<stop offset="0" stop-color="#ff9a3c"/><stop offset=".33" stop-color="#ff4f8b"/>
<stop offset=".66" stop-color="#9b5cff"/><stop offset="1" stop-color="#ff9a3c"/>
<animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="300 0" dur="9s" repeatCount="indefinite"/>
</linearGradient>
<linearGradient id="megaS" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#ff9a3c"/><stop offset=".4" stop-color="#ff4f8b"/>
<stop offset=".75" stop-color="#9b5cff"/><stop offset="1" stop-color="#3ad1ff"/>
</linearGradient>
<filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
<clipPath id="frame"><rect x="1" y="1" width="298" height="54" rx="24"/></clipPath>
</defs>
<g fill="#e8eefb">
<rect x="1" y="1" width="298" height="54" rx="28" fill="#111b36" stroke="url(#mega)" stroke-width="2.5"/>
<g transform="translate(36 28)"><g><animateTransform attributeName="transform" type="rotate" values="0;-18;18;-10;0;0" keyTimes="0;.1;.2;.3;.4;1" dur="2.6s" repeatCount="indefinite"/><circle r="16" fill="#ffffff" stroke="#0a0f1f" stroke-width="2.5"/><path d="M -16 0 A 16 16 0 0 1 16 0 Z" fill="#e5383b" stroke="#0a0f1f" stroke-width="2.5"/><circle r="5.5" fill="#ffffff" stroke="#0a0f1f" stroke-width="2.5"/></g></g>
<text x="66" y="35" class="b" font-size="17">Throw a Poké Ball</text>
<text x="276" y="35" text-anchor="end" class="b" font-size="17" fill="#3fa9f5">→</text>
</g>
</svg>
