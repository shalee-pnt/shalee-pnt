<g opacity="1"><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.1547;0.1667;0.9880;1" dur="30s" repeatCount="indefinite"/><text x="320" y="62" class="lb">PROJECT 01/06</text><text x="320" y="108" class="b" font-size="38" letter-spacing="-.5">Metacatalogue</text><rect x="320" y="120" width="56" height="4" rx="2" fill="#3fa9f5"/><text x="320" y="150" class="mu" font-size="13.5">work · private</text><text x="320" y="178" font-size="14.5" class="mu">Reads an entire file server so nobody else has to. Full-text search,</text><text x="320" y="199" font-size="14.5" class="mu">Active Directory sign-in, AI summaries from a local LLM.</text><rect x="320.0" y="238.0" width="58.9" height="22" rx="11.0" fill="#16244a" stroke="#25375f"/><text x="349.5" y="253.0" text-anchor="middle" class="b" font-size="11" fill="#e8eefb" letter-spacing=".6">Python</text><rect x="386.9" y="238.0" width="52.1" height="22" rx="11.0" fill="#16244a" stroke="#25375f"/><text x="413.0" y="253.0" text-anchor="middle" class="b" font-size="11" fill="#e8eefb" letter-spacing=".6">Flask</text><rect x="447.0" y="238.0" width="65.7" height="22" rx="11.0" fill="#16244a" stroke="#25375f"/><text x="479.9" y="253.0" text-anchor="middle" class="b" font-size="11" fill="#e8eefb" letter-spacing=".6">MariaDB</text><rect x="520.8" y="238.0" width="58.9" height="22" rx="11.0" fill="#16244a" stroke="#25375f"/><text x="550.2" y="253.0" text-anchor="middle" class="b" font-size="11" fill="#e8eefb" letter-spacing=".6">Whoosh</text><rect x="587.7" y="238.0" width="58.9" height="22" rx="11.0" fill="#16244a" stroke="#25375f"/><text x="617.1" y="253.0" text-anchor="middle" class="b" font-size="11" fill="#e8eefb" letter-spacing=".6">Ollama</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1547;0.1667;0.3213;0.3333;1" dur="30s" repeatCount="indefinite"/><text x="320" y="62" class="lb">PROJECT 02/06</text><text x="320" y="108" class="b" font-size="38" letter-spacing="-.5">Document audit tool</text><rect x="320" y="120" width="56" height="4" rx="2" fill="#3fa9f5"/><text x="320" y="150" class="mu" font-size="13.5">work · private</text><text x="320" y="178" font-size="14.5" class="mu">Scans document trees in read-only mode and grades the mess out of</text><text x="320" y="199" font-size="14.5" class="mu">100. Duplicates are found by hash, not by name.</text><rect x="320.0" y="238.0" width="58.9" height="22" rx="11.0" fill="#16244a" stroke="#25375f"/><text x="349.5" y="253.0" text-anchor="middle" class="b" font-size="11" fill="#e8eefb" letter-spacing=".6">Python</text><rect x="386.9" y="238.0" width="38.5" height="22" rx="11.0" fill="#16244a" stroke="#25375f"/><text x="406.2" y="253.0" text-anchor="middle" class="b" font-size="11" fill="#e8eefb" letter-spacing=".6">XML</text><rect x="433.4" y="238.0" width="45.3" height="22" rx="11.0" fill="#16244a" stroke="#25375f"/><text x="456.0" y="253.0" text-anchor="middle" class="b" font-size="11" fill="#e8eefb" letter-spacing=".6">JSON</text><rect x="486.7" y="238.0" width="38.5" height="22" rx="11.0" fill="#16244a" stroke="#25375f"/><text x="505.9" y="253.0" text-anchor="middle" class="b" font-size="11" fill="#e8eefb" letter-spacing=".6">CSV</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3213;0.3333;0.4880;0.5000;1" dur="30s" repeatCount="indefinite"/><text x="320" y="62" class="lb">PROJECT 03/06</text><text x="320" y="108" class="b" font-size="38" letter-spacing="-.5">Scubanion</text><rect x="320" y="120" width="56" height="4" rx="2" fill="#3fa9f5"/><text x="320" y="150" class="mu" font-size="13.5">team of 4 · public</text><text x="320" y="178" font-size="14.5" class="mu">A Tamagotchi that grows when you walk outside. I wrote the NFC kiosk</text><text x="320" y="199" font-size="14.5" class="mu">firmware and its anti-cheat.</text><rect x="320.0" y="238.0" width="38.5" height="22" rx="11.0" fill="#16244a" stroke="#25375f"/><text x="339.2" y="253.0" text-anchor="middle" class="b" font-size="11" fill="#e8eefb" letter-spacing=".6">C++</text><rect x="366.5" y="238.0" width="52.1" height="22" rx="11.0" fill="#16244a" stroke="#25375f"/><text x="392.5" y="253.0" text-anchor="middle" class="b" font-size="11" fill="#e8eefb" letter-spacing=".6">ESP32</text><rect x="426.6" y="238.0" width="45.3" height="22" rx="11.0" fill="#16244a" stroke="#25375f"/><text x="449.2" y="253.0" text-anchor="middle" class="b" font-size="11" fill="#e8eefb" letter-spacing=".6">MQTT</text><rect x="479.8" y="238.0" width="65.7" height="22" rx="11.0" fill="#16244a" stroke="#25375f"/><text x="512.7" y="253.0" text-anchor="middle" class="b" font-size="11" fill="#e8eefb" letter-spacing=".6">Laravel</text><rect x="553.6" y="238.0" width="38.5" height="22" rx="11.0" fill="#16244a" stroke="#25375f"/><text x="572.8" y="253.0" text-anchor="middle" class="b" font-size="11" fill="#e8eefb" letter-spacing=".6">Vue</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4880;0.5000;0.6547;0.6667;1" dur="30s" repeatCount="indefinite"/><text x="320" y="62" class="lb">PROJECT 04/06</text><text x="320" y="108" class="b" font-size="38" letter-spacing="-.5">AllRoads</text><rect x="320" y="120" width="56" height="4" rx="2" fill="#3fa9f5"/><text x="320" y="150" class="mu" font-size="13.5">team · private</text><text x="320" y="178" font-size="14.5" class="mu">Urban mobility app for the Nice area: buses, bikes, real-time</text><text x="320" y="199" font-size="14.5" class="mu">routes. I built tables, stored procedures and the sign-up screen.</text><rect x="320.0" y="238.0" width="86.2" height="22" rx="11.0" fill="#16244a" stroke="#25375f"/><text x="363.1" y="253.0" text-anchor="middle" class="b" font-size="11" fill="#e8eefb" letter-spacing=".6">TypeScript</text><rect x="414.2" y="238.0" width="65.7" height="22" rx="11.0" fill="#16244a" stroke="#25375f"/><text x="447.1" y="253.0" text-anchor="middle" class="b" font-size="11" fill="#e8eefb" letter-spacing=".6">Node.js</text><rect x="487.9" y="238.0" width="52.1" height="22" rx="11.0" fill="#16244a" stroke="#25375f"/><text x="514.0" y="253.0" text-anchor="middle" class="b" font-size="11" fill="#e8eefb" letter-spacing=".6">MySQL</text><rect x="548.0" y="238.0" width="58.9" height="22" rx="11.0" fill="#16244a" stroke="#25375f"/><text x="577.5" y="253.0" text-anchor="middle" class="b" font-size="11" fill="#e8eefb" letter-spacing=".6">Docker</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6547;0.6667;0.8213;0.8333;1" dur="30s" repeatCount="indefinite"/><text x="320" y="62" class="lb">PROJECT 05/06</text><text x="320" y="108" class="b" font-size="38" letter-spacing="-.5">Langdle</text><rect x="320" y="120" width="56" height="4" rx="2" fill="#3fa9f5"/><text x="320" y="150" class="mu" font-size="13.5">personal · private</text><text x="320" y="178" font-size="14.5" class="mu">Guess the programming language of the day. Like a daily word game,</text><text x="320" y="199" font-size="14.5" class="mu">but for people who have opinions about semicolons.</text><rect x="320.0" y="238.0" width="86.2" height="22" rx="11.0" fill="#16244a" stroke="#25375f"/><text x="363.1" y="253.0" text-anchor="middle" class="b" font-size="11" fill="#e8eefb" letter-spacing=".6">JavaScript</text><rect x="414.2" y="238.0" width="65.7" height="22" rx="11.0" fill="#16244a" stroke="#25375f"/><text x="447.1" y="253.0" text-anchor="middle" class="b" font-size="11" fill="#e8eefb" letter-spacing=".6">Node.js</text><rect x="487.9" y="238.0" width="38.5" height="22" rx="11.0" fill="#16244a" stroke="#25375f"/><text x="507.2" y="253.0" text-anchor="middle" class="b" font-size="11" fill="#e8eefb" letter-spacing=".6">CSS</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.8213;0.8333;0.9880;1" dur="30s" repeatCount="indefinite"/><text x="320" y="62" class="lb">PROJECT 06/06</text><text x="320" y="108" class="b" font-size="38" letter-spacing="-.5">PastaBox Randomizer</text><rect x="320" y="120" width="56" height="4" rx="2" fill="#3fa9f5"/><text x="320" y="150" class="mu" font-size="13.5">personal · private</text><text x="320" y="178" font-size="14.5" class="mu">Reduces the mental load of picking a PastaBox every day. Comes with</text><text x="320" y="199" font-size="14.5" class="mu">a cooking timer. Useless, but deeply satisfying.</text><rect x="320.0" y="238.0" width="86.2" height="22" rx="11.0" fill="#16244a" stroke="#25375f"/><text x="363.1" y="253.0" text-anchor="middle" class="b" font-size="11" fill="#e8eefb" letter-spacing=".6">JavaScript</text><rect x="414.2" y="238.0" width="99.8" height="22" rx="11.0" fill="#16244a" stroke="#25375f"/><text x="464.1" y="253.0" text-anchor="middle" class="b" font-size="11" fill="#e8eefb" letter-spacing=".6">LocalStorage</text></g>
