<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 56" width="300" height="56" role="img" aria-labelledby="title desc">
<title id="title">Throw a Poké Ball</title>
<desc id="desc">Opens a pre-filled issue that throws a ball at today's wild bug.</desc>
<style>
text{font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif}
.m{font-family:ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace}
.b{font-weight:700}
.mu{fill:#8a6470}
.lb{font-size:11px;letter-spacing:2.4px;font-weight:600;fill:#8a6470}
</style>
<defs>
<pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="9" cy="9" r="1.1" fill="#f6dbe1"/></pattern>
<filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
<clipPath id="frame"><rect x="1" y="1" width="298" height="54" rx="24"/></clipPath>
</defs>
<g fill="#25161c">
<rect x="1.5" y="1.5" width="297" height="53" rx="26.5" fill="#ffffff" stroke="#d7263d" stroke-width="2.5"/>
<g transform="translate(36 28)"><g><animateTransform attributeName="transform" type="rotate" values="0;-18;18;-10;0;0" keyTimes="0;.1;.2;.3;.4;1" dur="2.6s" repeatCount="indefinite"/><circle r="16" fill="#ffffff" stroke="#3a2a1a" stroke-width="2.5"/><path d="M -16 0 A 16 16 0 0 1 16 0 Z" fill="#e5383b" stroke="#3a2a1a" stroke-width="2.5"/><circle r="5.5" fill="#ffffff" stroke="#3a2a1a" stroke-width="2.5"/></g></g>
<text x="66" y="35" class="b" font-size="17">Throw a Poké Ball</text>
<text x="276" y="35" text-anchor="end" class="b" font-size="17" fill="#d7263d">→</text>
</g>
</svg>
